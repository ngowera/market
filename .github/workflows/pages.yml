name: Publish GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
        with:
          version: latest
      - name: Deploy Supabase API
        if: ${{ vars.SUPABASE_PROJECT_REF != '' }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "Set the SUPABASE_ACCESS_TOKEN repository secret to deploy the API." >&2
            exit 1
          fi
          supabase secrets set \
            "ALLOWED_ORIGIN=https://ngowera.github.io" \
            "APP_URL=https://ngowera.github.io/market" \
            --project-ref "$SUPABASE_PROJECT_REF"
          supabase functions deploy api --project-ref "$SUPABASE_PROJECT_REF"
      - run: node scripts/build-pages.mjs
        env:
          PAGES_BASE_PATH: /market/
          VITE_API_URL: ${{ vars.SUPABASE_PROJECT_REF && format('https://{0}.supabase.co/functions/v1/api', vars.SUPABASE_PROJECT_REF) }}
          VITE_SUPABASE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out-pages
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
